version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Rebase open PRs on conflicts so auto-merge can continue
    rebase-strategy: "auto"
    # Wait 14 days before updating to help circumvent supply chain attacks
    cooldown:
      default-days: 14

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # Rebase open PRs on conflicts so auto-merge can continue
    rebase-strategy: "auto"
    # Wait 14 days before updating to help circumvent supply chain attacks
    cooldown:
      default-days: 14

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/.github/helm"
    schedule:
      interval: "weekly"
    # Rebase open PRs on conflicts so auto-merge can continue
    rebase-strategy: "auto"
    # Wait 14 days before updating to help circumvent supply chain attacks
    cooldown:
      default-days: 14
    ignore:
      # Stay on Helm 3
      - dependency-name: "alpine/helm"
        update-types: ["version-update:semver-major"]
